# Codacy analyses the code of the application, not the documentation site: docs/ is an Astro
# Starlight project (pages, a config file, data, a check script) with a package-lock.json
# written by npm, and the default rules report their formatting as issues.
#
# EF Core migrations are written by `dotnet ef`. Each one is a partial class split with its
# *.Designer.cs file, which Codacy skips as generated: it then reports `partial` as useless.
---
exclude_paths:
  - "docs/**"
  - "**/Migrations/**"
