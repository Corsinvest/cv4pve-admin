name: Release Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # A manual run builds the tag it was asked for, not the branch it was started from.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Extract and validate version
        id: version
        # The tag typed in a manual run reaches the script as a variable, never as script text.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          PROJECT_PATH="src/Corsinvest.ProxmoxVE.Admin/Corsinvest.ProxmoxVE.Admin.csproj"
          PROJECT_VERSION=$(dotnet msbuild $PROJECT_PATH -getProperty:Version -nologo | tr -d '[:space:]')
          echo "Project version: $PROJECT_VERSION"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_VERSION="${INPUT_TAG#v}"
          else
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "Tag version: $TAG_VERSION"

          if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ ERROR: Version mismatch!"
            echo "   Project version : $PROJECT_VERSION"
            echo "   Git tag         : v$TAG_VERSION"
            exit 1
          fi

          echo "✅ Version validated: $PROJECT_VERSION"
          echo "version=$PROJECT_VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog section
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{found=0} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "[Website](https://corsinvest.it/cv4pve-admin) | [Docker Hub CE](https://hub.docker.com/r/corsinvest/cv4pve-admin) | [Docker Hub EE](https://hub.docker.com/r/corsinvest/cv4pve-admin-ee)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download assets
        run: pwsh -ExecutionPolicy Bypass -File admin.ps1 -Command download-assets

      # The documentation site is embedded into the published app under /help/ via Docs.props.
      # Build it before `dotnet publish` so the EnsureDocsBuilt target finds docs/dist-help/index.html.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build documentation site
        run: pwsh -ExecutionPolicy Bypass -File admin.ps1 -Command docs-build

      - name: Build MCP Bridge binaries
        run: |
          MCP_PROJECT="src/Corsinvest.ProxmoxVE.Admin.McpBridge/Corsinvest.ProxmoxVE.Admin.McpBridge.csproj"
          mkdir -p publish/mcp-bridge
          for rid in win-x64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            echo "➡ Building for $rid..."
            dotnet publish "$MCP_PROJECT" -c Release -r "$rid" -o publish/mcp-bridge -p:AssemblyName="cv4pve-mcp-bridge-$rid"
          done

      # Nothing is published until everything has been built: the image goes to Docker Hub
      # only when the release assets are ready, so a failed build leaves no image without a release.
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.hub.docker.com
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          dotnet publish src/Corsinvest.ProxmoxVE.Admin/Corsinvest.ProxmoxVE.Admin.csproj \
            /t:PublishContainer \
            -c Release \
            /p:ContainerRegistry=registry.hub.docker.com

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: publish/mcp-bridge/cv4pve-mcp-bridge-*
