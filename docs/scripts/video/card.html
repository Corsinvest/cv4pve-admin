Title and closing card of the presentation video. record.mjs loads it with the texts in window.__card
(or ?title=&subtitle=&footer= when opened by hand) and adds the "play" class to the body when the
recording starts, so the animation is not cut.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>cv4pve-admin</title>
<style>
    :root {
        --blue: #004e8c;
        --blue-light: #4aa3e8;
        --bg: #07111c;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #0f2a44 0%, var(--bg) 70%);
        color: #fff;
        font-family: "Segoe UI", system-ui, sans-serif;
    }

    .card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .title, .subtitle, .footer { opacity: 0; }

    .title {
        font-size: 128px;
        font-weight: 600;
        letter-spacing: -2px;
        transform: translateY(24px);
    }

    .title .accent { color: var(--blue-light); }

    .line {
        width: 0;
        height: 4px;
        margin: 28px 0 32px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--blue), var(--blue-light));
    }

    .subtitle {
        font-size: 44px;
        font-weight: 300;
        color: #d6e6f5;
        transform: translateY(12px);
    }

    .footer {
        margin-top: 56px;
        font-size: 30px;
        color: var(--blue-light);
    }

    .play .title { animation: rise 0.9s cubic-bezier(.2,.7,.2,1) 0.1s forwards; }
    .play .line { animation: grow 0.8s cubic-bezier(.2,.7,.2,1) 0.6s forwards; }
    .play .subtitle { animation: rise 0.8s cubic-bezier(.2,.7,.2,1) 1.0s forwards; }
    .play .footer { animation: rise 0.8s cubic-bezier(.2,.7,.2,1) 1.5s forwards; }

    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes grow { to { width: 560px; } }
</style>
</head>
<body>
<div class="card">
    <div class="title" id="title"></div>
    <div class="line"></div>
    <div class="subtitle" id="subtitle"></div>
    <div class="footer" id="footer"></div>
</div>
<script>
    const q = window.__card ?? Object.fromEntries(new URLSearchParams(location.search));
    const title = q.title ?? '';
    const cut = title.indexOf('-');
    const el = document.getElementById('title');
    if (cut > 0) {
        el.append(title.slice(0, cut));
        const accent = document.createElement('span');
        accent.className = 'accent';
        accent.textContent = title.slice(cut);
        el.append(accent);
    } else {
        el.textContent = title;
    }
    document.getElementById('subtitle').textContent = q.subtitle ?? '';
    document.getElementById('footer').textContent = q.footer ?? '';
</script>
</body>
</html>
